name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: cinch-dev2 verify
      - run: cinch-dev2 list
      - run: python scripts/generate_figures.py
      - name: Check generated validation figures
        run: |
          test -s docs/figures/FIG02_EPIDIS_VALIDATION.png
          test -s docs/figures/FIG02_EPIDIS_VALIDATION.svg
          test -s docs/figures/FIG03_DIFF_GWES_VALIDATION.png
          test -s docs/figures/FIG03_DIFF_GWES_VALIDATION.svg
          test -s site/assets/FIG02_EPIDIS_VALIDATION.png
          test -s site/assets/FIG03_DIFF_GWES_VALIDATION.png
