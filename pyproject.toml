[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinch-dev2"
version = "0.1.0.dev0"
description = "Phylogeny-aware information-theoretic dependency discovery for bacterial allele profiles"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Naclist"}]
keywords = ["bioinformatics", "epistasis", "mutual-information", "microbial-genomics", "wgMLST", "cgMLST"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "biopython>=1.83",
  "numba>=0.59",
  "umap-learn>=0.5",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cinch-dev2 = "cinch_dev2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cinch_dev2 = ["workflow.json", "scripts/snapshots/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

